name: home-manager-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # Required by cache-nix-action to purge older cache versions.
  actions: write

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Keep this a matrix: add a system here and in `systems` in flake.nix
        # when it becomes supported.
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true
            # The switch job runs as `yayoi`, so that account must be allowed
            # to add substituters (the flake's caches) or Nix ignores them:
            # "ignoring untrusted substituter ... you are not a trusted user".
            extra-trusted-users = yayoi

      # `nix flake check` does not build anything today, so this job has no
      # use for the store cache; only the switch job restores it.
      - name: Run flake check
        run: nix flake check --print-build-logs

  switch:
    strategy:
      fail-fast: false
      matrix:
        # Keep this a matrix: add a system here and in `systems` in flake.nix
        # when it becomes supported.
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true
            # The switch job runs as `yayoi`, so that account must be allowed
            # to add substituters (the flake's caches) or Nix ignores them:
            # "ignoring untrusted substituter ... you are not a trusted user".
            extra-trusted-users = yayoi

      # Cache only what the substituters cannot serve: the paths this job
      # builds. Everything else comes from the binary caches configured below.
      #
      # The key tracks flake.lock, so a .nix change restores the same cache
      # without uploading a new copy.
      - name: Restore locally built store paths
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-bincache-${{ matrix.system }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: |
            nix-bincache-${{ matrix.system }}-
          nix: false
          paths-linux: ${{ runner.temp }}/nix-bincache
          save: ${{ github.event_name == 'push' }}
          purge: true
          purge-prefixes: nix-bincache-${{ matrix.system }}-
          purge-created: 0
          purge-primary-key: never

      - name: Create yayoi user
        shell: bash
        run: |
          set -euxo pipefail
          # `useradd -m` takes over a minute on these runners (it blocks inside
          # account creation, not in the home directory copy), so create the
          # account without a home and install the directory separately.
          if ! id yayoi >/dev/null 2>&1; then
            sudo useradd --no-create-home --no-log-init -s /bin/bash yayoi
          fi
          sudo install -d -m 0755 -o yayoi -g yayoi /home/yayoi

      - name: Prepare ghq-style repository path
        shell: bash
        run: |
          set -euxo pipefail
          repo=/home/yayoi/ghq/github.com/yqYo1/dotfiles
          sudo -u yayoi mkdir -p "$(dirname "$repo")"
          sudo rsync -a --delete --exclude '.git' "$GITHUB_WORKSPACE"/ "$repo"/
          sudo chown -R yayoi:yayoi /home/yayoi/ghq

      - name: Import cached store paths
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/nix-bincache"
          if [ -f "$dir/bundle.nar" ]; then
            # The bundle is unsigned; --import still verifies content hashes.
            nix-store --import < "$dir/bundle.nar" >/dev/null
          else
            echo "no cached store paths to import"
          fi

      - name: Run nix run . as yayoi
        shell: bash
        env:
          # Nix ignores the flake's nixConfig in CI (the flake is not a trusted
          # source), so the binary caches the flake declares must be passed
          # explicitly, or every cacheable path is rebuilt from source here.
          NIX_CONFIG: |
            extra-substituters = https://cache.numtide.com https://yqyo1.cachix.org https://catppuccin.cachix.org
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= yqyo1.cachix.org-1:8v2GAv9lm0AURGOHo92N4+lgAhVE0+v8ou3DFT7hDEg= catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU=
        run: |
          set -euxo pipefail
          sudo -u yayoi env \
            HOME=/home/yayoi \
            USER=yayoi \
            LOGNAME=yayoi \
            NIX_CONFIG="$NIX_CONFIG" \
            XDG_CACHE_HOME=/home/yayoi/.cache \
            XDG_STATE_HOME=/home/yayoi/.local/state \
            XDG_CONFIG_HOME=/home/yayoi/.config \
            bash -lc '
              set -euxo pipefail
              cd /home/yayoi/ghq/github.com/yqYo1/dotfiles
              nix --version
              nix run .
            ' 2>&1 | tee "$RUNNER_TEMP/nix-run.log"

      - name: Collect store paths for the cache
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/nix-run.log"
          dir="$RUNNER_TEMP/nix-bincache"
          # What Nix built here is what the substituters could not serve.
          grep -o "building '/nix/store/[^']*\.drv'" "$log" \
            | sed "s/^building '//; s/'$//" | sort -u > "$RUNNER_TEMP/built-drvs.txt" || true
          while IFS= read -r drv; do
            [ -n "$drv" ] || continue
            # --export refuses paths that are not valid in this store.
            while IFS= read -r out; do
              nix-store --check-validity "$out" 2>/dev/null && printf '%s\n' "$out"
            done < <(nix-store -q --outputs "$drv" 2>/dev/null || true)
          done < "$RUNNER_TEMP/built-drvs.txt" | sort -u > "$RUNNER_TEMP/built-paths.txt"
          if [ -s "$RUNNER_TEMP/built-paths.txt" ]; then
            mkdir -p "$dir"
            mapfile -t paths < "$RUNNER_TEMP/built-paths.txt"
            nix-store --export "${paths[@]}" > "$dir/bundle.nar"
          fi
          echo "collected $(wc -l < "$RUNNER_TEMP/built-paths.txt") store paths"
          du -sh "$dir"
