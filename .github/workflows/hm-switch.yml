name: home-manager-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Keep this a matrix: add a system here and in `systems` in flake.nix
        # when it becomes supported.
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true
            # The switch job runs as `yayoi`, so that account must be allowed
            # to add substituters (the flake's caches) or Nix ignores them:
            # "ignoring untrusted substituter ... you are not a trusted user".
            extra-trusted-users = yayoi

      # `nix flake check` does not build anything today, so this job has no
      # use for the store cache; only the switch job restores it.
      - name: Run flake check
        run: nix flake check --print-build-logs

  switch:
    strategy:
      fail-fast: false
      matrix:
        # Keep this a matrix: add a system here and in `systems` in flake.nix
        # when it becomes supported.
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true
            # The switch job runs as `yayoi`, so that account must be allowed
            # to add substituters (the flake's caches) or Nix ignores them:
            # "ignoring untrusted substituter ... you are not a trusted user".
            extra-trusted-users = yayoi

      - name: Create yayoi user
        shell: bash
        run: |
          set -euxo pipefail
          # `useradd -m` takes over a minute on these runners (it blocks inside
          # account creation, not in the home directory copy), so create the
          # account without a home and install the directory separately.
          if ! id yayoi >/dev/null 2>&1; then
            sudo useradd --no-create-home --no-log-init -s /bin/bash yayoi
          fi
          sudo install -d -m 0755 -o yayoi -g yayoi /home/yayoi

      - name: Prepare ghq-style repository path
        shell: bash
        run: |
          set -euxo pipefail
          repo=/home/yayoi/ghq/github.com/yqYo1/dotfiles
          sudo -u yayoi mkdir -p "$(dirname "$repo")"
          sudo rsync -a --delete --exclude '.git' "$GITHUB_WORKSPACE"/ "$repo"/
          sudo chown -R yayoi:yayoi /home/yayoi/ghq

      - name: Run nix run . as yayoi
        shell: bash
        env:
          # Nix ignores the flake's nixConfig in CI (the flake is not a trusted
          # source), so the binary caches the flake declares must be passed
          # explicitly, or every cacheable path is rebuilt from source here.
          NIX_CONFIG: |
            extra-substituters = https://cache.numtide.com https://yqyo1.cachix.org https://catppuccin.cachix.org
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= yqyo1.cachix.org-1:8v2GAv9lm0AURGOHo92N4+lgAhVE0+v8ou3DFT7hDEg= catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU=
        run: |
          set -euxo pipefail
          sudo -u yayoi env \
            HOME=/home/yayoi \
            USER=yayoi \
            LOGNAME=yayoi \
            NIX_CONFIG="$NIX_CONFIG" \
            XDG_CACHE_HOME=/home/yayoi/.cache \
            XDG_STATE_HOME=/home/yayoi/.local/state \
            XDG_CONFIG_HOME=/home/yayoi/.config \
            bash -lc '
              set -euxo pipefail
              cd /home/yayoi/ghq/github.com/yqYo1/dotfiles
              nix --version
              nix run .
            '
