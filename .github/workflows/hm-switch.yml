name: home-manager-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true
            # The switch job runs as `yayoi`, so that account must be allowed
            # to add substituters (the flake's caches) or Nix ignores them:
            # "ignoring untrusted substituter ... you are not a trusted user".
            extra-trusted-users = yayoi

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ github.job }}-${{ matrix.system }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ github.job }}-${{ matrix.system }}-
            nix-switch-${{ matrix.system }}-
            nix-check-${{ matrix.system }}-
          gc-max-store-size-linux: 8G

      - name: Run flake check
        run: nix flake check --print-build-logs

  switch:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true
            # The switch job runs as `yayoi`, so that account must be allowed
            # to add substituters (the flake's caches) or Nix ignores them:
            # "ignoring untrusted substituter ... you are not a trusted user".
            extra-trusted-users = yayoi

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ github.job }}-${{ matrix.system }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ github.job }}-${{ matrix.system }}-
            nix-check-${{ matrix.system }}-
            nix-switch-${{ matrix.system }}-
          gc-max-store-size-linux: 8G

      - name: Create yayoi user
        shell: bash
        run: |
          set -euxo pipefail
          if ! id yayoi >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash yayoi
          fi
          sudo mkdir -p /home/yayoi
          sudo chown -R yayoi:yayoi /home/yayoi

      - name: Prepare ghq-style repository path
        shell: bash
        run: |
          set -euxo pipefail
          repo=/home/yayoi/ghq/github.com/yqYo1/dotfiles
          sudo -u yayoi mkdir -p "$(dirname "$repo")"
          sudo rsync -a --delete --exclude '.git' "$GITHUB_WORKSPACE"/ "$repo"/
          sudo chown -R yayoi:yayoi /home/yayoi/ghq

      - name: Run nix run . as yayoi
        shell: bash
        env:
          # Nix ignores the flake's nixConfig in CI (the flake is not a trusted
          # source), so the binary caches the flake declares must be passed
          # explicitly, or every cacheable path is rebuilt from source here.
          NIX_CONFIG: |
            extra-substituters = https://cache.numtide.com https://yqyo1.cachix.org https://catppuccin.cachix.org
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= yqyo1.cachix.org-1:8v2GAv9lm0AURGOHo92N4+lgAhVE0+v8ou3DFT7hDEg= catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU=
        run: |
          set -euxo pipefail
          sudo -u yayoi env \
            HOME=/home/yayoi \
            USER=yayoi \
            LOGNAME=yayoi \
            NIX_CONFIG="$NIX_CONFIG" \
            XDG_CACHE_HOME=/home/yayoi/.cache \
            XDG_STATE_HOME=/home/yayoi/.local/state \
            XDG_CONFIG_HOME=/home/yayoi/.config \
            bash -lc '
              set -euxo pipefail
              cd /home/yayoi/ghq/github.com/yqYo1/dotfiles
              nix --version
              nix run .
            '
